[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (React Router-less flat page still gets clean 404 semantics)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Send app deep-links to the SPA subdomain. dagontvangst.be is marketing;
# app.dagontvangst.be is the authenticated product.
[[redirects]]
  from = "/app"
  to = "https://app.dagontvangst.be/"
  status = 302
  force = true

[[redirects]]
  from = "/app/*"
  to = "https://app.dagontvangst.be/:splat"
  status = 302
  force = true

# The landing links straight into app.dagontvangst.be, so a script injected
# here is a phishing surface for the product itself. The policy mirrors the
# app's: no inline scripts (the Vite build emits none), inline styles only
# because Framer Motion sets them, fonts from Google, and the one outbound
# request the site makes — the contact form — named explicitly.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://formsubmit.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
